# A prototype of the Local tab in GPUI, to compare with the WebKit app
# (memory, feel, looks) before deciding on a port. Its own workspace and
# target folder: it doesn't touch the app's build.
[package]
name = "wallpicker-gpui-local"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui-kit = "0.7"
wallpicker-core = { path = "../../crates/core", features = ["native"] }

[profile.release]
debug = false
