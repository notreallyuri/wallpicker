<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wallpicker</title>
    <!-- Dark/light and colors before the first frame (no white flash on open). -->
    <link data-trunk rel="copy-file" href="assets/early-theme.js" />
    <script src="/early-theme.js"></script>
    <!-- Tailwind v4, run by trunk (version pinned in Trunk.toml). It scans src/,
         which is where `cargo nocli` put the nocomponents styled layer. -->
    <link data-trunk rel="tailwind-css" href="styles/globals.css" />
    <link data-trunk rel="copy-dir" href="assets/fonts" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body class="bg-background text-foreground antialiased"></body>
</html>
