[package]
name = "wallpicker-app"
description = "wallpicker's old Tauri window (WebKit + Leptos), until the Quickshell interface replaces it"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wallpicker_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The command line and the shared commands.
wallpicker = { path = "../crates/wallpicker" }
wallpicker-core = { path = "../crates/core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# glibc malloc tuning (memory handed back after big image buffers).
libc = "0.2"
# Native file dialogs (backup export/import, the snapshot folder).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[features]
# Test builds: replay a scripted session in the window (tray.rs).
automation = []

[target.'cfg(target_os = "linux")'.dependencies]
# The webview's cache settings (tray.rs); the version wry uses.
webkit2gtk = "2.0"
