[package]
name = "wallpicker"
description = "Visual wallpaper picker for hyprpaper with Wallhaven search"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wallpicker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Local time, for the slideshow's night window.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wallpicker-core = { path = "../crates/core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# glibc malloc tuning (memory handed back after big image buffers).
libc = "0.2"
# Native file dialogs (backup export/import, the snapshot folder).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Moves deleted wallpapers to the freedesktop trash instead of removing them.
trash = "5"

[features]
# Test builds: replay a scripted session in the window (tray.rs).
automation = []

[target.'cfg(target_os = "linux")'.dependencies]
# The webview's cache settings (tray.rs); the version wry uses.
webkit2gtk = "2.0"
