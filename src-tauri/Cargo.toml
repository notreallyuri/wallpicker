[package]
name = "wallpicker"
description = "Visual wallpaper picker for hyprpaper with Wallhaven search"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wallpicker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wallpicker-core = { path = "../crates/core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Moves deleted wallpapers to the freedesktop trash instead of removing them.
trash = "5"
