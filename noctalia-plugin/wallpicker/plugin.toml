id = "wallpicker/wallpicker"
name = "wallpicker"
version = "0.16.0"
# runAsync with an argv table needs API 24; right-click menus (panel.openContextMenu) need 28.
plugin_api = 28
author = "wallpicker"
license = "MIT"
dependencies = []
tags = ["wallpaper"]
icon = "photo"
description = "wallpicker's quick picker: your library (favorites first) and online search (Wallhaven, Konachan, yande.re); click to apply. Settings, duplicates, collections and tag editing open in the app."

[[setting]]
key = "command"
type = "string"
label_key = "settings.command.label"
description_key = "settings.command.description"
default = "wallpicker"

[[panel]]
id = "picker"
entry = "panel.luau"
width = 920
height = 760
placement = "attached"
position = "auto"
# Esc backs out of a sub-view (then closes); Ctrl+F search field; Ctrl+R
# random; Alt+Up parent folder; Alt+Left/Right online pages; Ctrl+1/2 tabs.
# No plain letters: they'd be taken from the search field.
capture_keys = ["escape", "ctrl+f", "ctrl+r", "alt+up", "alt+left", "alt+right", "ctrl+1", "ctrl+2"]

[[service]]
id = "slideshow"
entry = "slideshow.luau"

[[widget]]
id = "wallpicker"
entry = "bar.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "photo"
