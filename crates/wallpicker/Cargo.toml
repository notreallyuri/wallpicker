[package]
name = "wallpicker"
description = "Wallpaper picker with a native Wayland renderer, command line and Quickshell interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wallpicker"

[[bin]]
name = "wallpicker"
path = "src/main.rs"

[dependencies]
# Local time, for the slideshow's night window.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wallpicker-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The system's file dialogs (backup export/import, the snapshot folder),
# through the XDG desktop portal: no GTK here.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "file_chooser"] }
# Moves deleted wallpapers to the freedesktop trash instead of removing them.
trash = "5"
# wallpicker's own renderer (renderer/): layer shell, shm, outputs and its
# event loop (calloop). No keyboard (xkbcommon) needed.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
# Shader transitions; libraries are loaded at runtime, with Fade as fallback.
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.17"
libloading = "0.8"
# Linux resource limits for isolated animation decoders.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
gif = "0.14"
